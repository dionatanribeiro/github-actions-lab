name: "Environments e Proteções"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.example.com
    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4
      
      - name: "Exibir informações do Environment"
        run: |
          echo "Nome do Environment: ${{ github.event.workflow_run.environment.name }}"
          echo "URL do Environment: ${{ github.event.workflow_run.environment.url }}"
      
      - name: "Exibir variaveis de ambiente do Environment"
        run: |
          echo "ENVIRONMENT: ${{ vars.ENVIRONMENT }}"
          echo "DEBUG_MODE: ${{ vars.DEBUG_MODE }}"

      - name: "Finalizar"
        run: |
          echo "Deploy concluído com sucesso em branch ${GITHUB_REF_NAME:-branch}"
