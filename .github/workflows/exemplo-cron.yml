name: "Exemplo utilizando Cron"

on:
  schedule:
    # Executa o workflow todos os dias às 14:30 (UTC)
    - cron: '*/5 * * * *'
    # - cron: '30 14 * * *'
  workflow_dispatch: # permite execução manual pela interface

jobs:
  scheduled-job:
    name: "Exemplo de execução utilizando Cron"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "Exemplo de execução utilizando Cron"
        run: |
          echo "====== EXECUÇÃO UTILIZANDO CRON ======"
          echo "Data e hora da execução: $(date)"
          echo "Hora UTC: $(date -u)"
          echo "Timezone: $(date +%Z)"

      - name: "Relatório diário automatizado"
        run: |
          echo "====== RELATÓRIO DIÁRIO AUTOMATIZADO ======"
          echo "==========================================="
          echo "Total de commits: $(git rev-list --all --count)"
          echo "Contribuições de hoje: $(git log --since=midnight --pretty=format:'%h' | wc -l)"
          echo "Último commit: $(git log -1 --pretty=format:'%h - %s (%ci)')"
          echo "==========================================="
